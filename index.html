<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxury Homes Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#49B748; --green-bg:#EBF7ED; --green-soft:#F4FFF6; --green-line:#E1F3E4;
  --ink:#0F172A; --ink2:#2C2C2C; --ink3:#303030; --ink4:#404040; --h:#1F2937;
  --muted:#595959; --muted2:#747474; --muted3:#7F7F7F; --muted4:#A3A3A3;
  --line:#EEEEEE; --line2:#EBEBEB; --page:#F9F9F9; --card:#F7F7F7; --field:#FDFDFD; --dark:#303030; --side:#1A1D23;
  --red:#BB0000; --red-bg:#FDECEC; --req:#EF4444; --amber:#B45309; --amber-bg:#FEF6E7; --amber-line:#F8E3BA;
  --gold:#8A6D3B; --gold2:#AD9976; --site:#0C0B0A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans",sans-serif;background:var(--page);color:var(--ink);font-size:14px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit}
.app{display:flex;height:100vh}
/* CRM sidebar */
.side{width:240px;background:var(--side);color:#fff;flex-shrink:0;display:flex;flex-direction:column;padding:0 12px}
.logo{height:72px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #3a3d44;margin-bottom:22px;padding-left:2px}
.logo b{font-size:34px;font-weight:700;color:var(--green);letter-spacing:-1px}
.logo span{font-size:9px;background:var(--green);color:var(--side);font-weight:700;padding:1px 3px;border-radius:2px;margin-top:8px}
.side .grp{font-size:12px;letter-spacing:3px;color:#7d8088;margin:18px 10px 10px}
.side a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.side a.on{background:var(--green-bg);color:var(--green)}
.side svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
/* top */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:70px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #F4F4F4}
.top .collapse{width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:18px}
.top .search{width:480px;height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted4)}
.top .sp{flex:1}
.qa{height:46px;padding:0 12px;border-radius:6px;background:var(--dark);color:#fdfdfd;font-weight:500}
.ic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.ic .n{position:absolute;top:0;right:0;background:#E53935;color:#fff;font-size:9px;border-radius:9px;padding:1px 4px}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.user i{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#777,#333);display:block}
/* editor shell */
.wrap{flex:1;padding:28px 28px 0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ehead{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.back{width:30px;height:30px;border-radius:6px;background:var(--line);color:var(--green);font-size:18px;margin-top:6px}
.ehead h1{font-size:16px;font-weight:700;color:#1A1D23}
.ehead p{color:var(--muted);font-size:14px;margin-top:2px}
.ehead .acts{margin-left:auto;text-align:right}
.ehead .row{display:flex;gap:12px;justify-content:flex-end}
.lastpub{font-size:12px;color:var(--muted);margin-top:6px}
.btn{height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.white{background:#fff;color:var(--ink3);border:1px solid #F4F4F4}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.dark{background:var(--dark);color:#FDFDFD}
.btn.sm{height:32px;padding:4px 10px;font-size:12px}
.btn.out-red{background:var(--field);color:var(--red);border:1px solid var(--red)}
.btn.ghost{height:32px;padding:4px 10px;font-size:12px;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.editor{flex:1;display:flex;gap:10px;min-height:0;padding-bottom:20px}
.enav{width:176px;background:#fff;border-radius:8px 8px 0 0;overflow-y:auto;padding:8px 0 30px;flex-shrink:0}
.enav .g{font-size:12px;font-weight:600;color:var(--muted4);padding:12px 16px 6px;text-transform:uppercase;border-top:1px solid var(--line);margin-top:6px}
.enav .g:first-child{border-top:0;margin-top:0}
.enav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;height:34px;padding:0 12px 0 16px;font-size:14px;font-weight:500;color:var(--ink2)}
.enav button.on{background:var(--green-bg)}
.enav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;background:#E6E6E6;color:#222;border-radius:12px;padding:2px 6px;flex-shrink:0;margin-left:4px}
.tag.new{background:var(--green);color:#fff;font-weight:600}
/* content (wide, like IDX Configuration) */
.content{flex:1;background:#fff;border-radius:8px 8px 0 0;overflow-y:auto;padding:18px 18px 60px;min-width:0}
.c-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:32px}
.c-title h2{font-size:14px;font-weight:700;color:var(--ink2)}
.c-title .r{margin-left:auto;display:flex;gap:8px}
.backbtn{width:30px;height:30px;border-radius:50%;background:#F3F3F3;font-size:15px;color:var(--ink2)}
.info{background:var(--green-soft);border:1px solid var(--green-line);border-radius:8px;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.info .i{width:18px;height:18px;border:1.5px solid var(--green);border-radius:50%;color:var(--green);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.info a{margin-left:auto;color:var(--green);font-weight:600;text-decoration:underline;cursor:pointer;font-size:12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#F5F5F5;border-radius:16px;padding:20px}
.stat small{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.stat b{font-size:16px;color:var(--ink2)}
.stat .fname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .fname+.fname{margin-top:2px}
.ulink{font-size:12px;color:var(--green);font-weight:600;text-decoration:underline;cursor:pointer;display:inline-block;margin-bottom:26px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h3{font-size:16px;font-weight:600;color:var(--ink2)}
.sec-h p{font-size:12px;color:var(--muted3);margin-top:4px}
.block{margin-bottom:34px}
/* rows (page content) */
.rowc{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#F7F7F7}
.rowc.open{background:#fff}
.rowc-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.rowc-h .chev{font-size:11px;color:var(--ink2);width:12px;transition:transform .15s}
.rowc.open .chev{transform:rotate(90deg)}
.rowc-h b{font-size:14px;font-weight:600;color:var(--ink2)}
.rowc-h .sum{font-size:12px;color:var(--muted3);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rowc-b{padding:2px 16px 16px 38px}
.badge{font-size:11px;border-radius:10px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.b-edit{background:var(--green-bg);color:var(--green)}
.b-auto{background:#EEF2FF;color:#4338CA}
.b-lock{background:#EFEFEF;color:#555}
.b-err{background:var(--red-bg);color:var(--red)}
.b-pub{background:var(--green-bg);color:#2F8F2E}
.b-draft{background:#EFEFEF;color:#555}
.b-pin{background:#FFF7E6;color:#9A6400}
.b-off{background:#F1F1F1;color:#888}
/* fields */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f{margin-bottom:12px}
.f>label,.lbl{display:block;font-size:12px;color:var(--ink3);margin-bottom:5px}
.req{color:var(--req)}
.lbl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.lbl-row label{margin:0;font-size:12px;color:var(--ink3)}
.cnt{font-size:11px;color:var(--muted4)}
.cnt.bad{color:var(--red)}.cnt.ok{color:#2F8F2E}
.in,.ta,select.in{width:100%;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0 8px;font-size:12px;color:var(--ink3);outline:none}
.in{height:34px}
.ta{min-height:76px;resize:vertical;line-height:1.5;padding:8px}
.in:focus,.ta:focus{border-color:var(--green)}
.in.err,.ta.err{border-color:var(--red)}
.hint{font-size:11.5px;color:var(--muted3);margin-top:5px;line-height:1.45}
.err-t{font-size:11.5px;color:var(--red);margin-top:5px}
.warn-box{background:var(--amber-bg);border:1px solid var(--amber-line);color:#7C4A03;border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.45;margin-top:6px}
.locked{background:#FAFAFA;border:1px dashed #DDD;border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--muted);line-height:1.5}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
/* picker (like County / City / ZIP in IDX config) */
.pickw{position:relative}
.pick{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;height:42px;padding-right:12px;cursor:text}
.pick.open{border-color:var(--green)}
.pick input{flex:1;border:0;outline:0;background:transparent;font-size:14px;padding-left:12px;color:#1A1D23;height:100%}
.pick input::placeholder{color:var(--muted4)}
.pick .chev{color:var(--muted);font-size:13px}
.plist{position:absolute;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.08);z-index:30;max-height:240px;overflow:auto;padding:4px}
.plist button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;font-size:13px;text-align:left;border-radius:6px}
.plist button:hover{background:var(--green-bg)}
.plist .ck{width:16px;height:16px;border:1.5px solid #CFCFCF;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
.plist .on .ck{background:var(--green);border-color:var(--green)}
.plist .c{margin-left:auto;color:var(--muted4);font-size:11.5px}
.pick.sel{cursor:pointer;padding-left:12px}
.pick.sel.dis{background:#FAFAFA;cursor:not-allowed}
.selv{flex:1;font-size:14px;color:#1A1D23;display:flex;align-items:center;gap:8px}
.selv.ph{color:var(--muted4)}
.tagt{font-size:10.5px;background:#EEE;color:var(--ink4);border-radius:10px;padding:1px 7px}
.plist .grp{font-size:11px;font-weight:600;color:var(--muted4);text-transform:uppercase;padding:8px 10px 4px}
.plist .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid #CFCFCF;flex-shrink:0;position:relative}
.plist .on .rd{border-color:var(--green)}
.plist .on .rd:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--green)}
.plist .none{padding:10px;font-size:12px;color:var(--muted3)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{background:#EEEEEE;color:var(--ink4);border-radius:9999px;padding:2px 6px 2px 8px;font-size:12px;display:inline-flex;align-items:center;gap:4px;height:22px}
.pill button{width:13px;height:13px;border:1px solid #8a8a8a;border-radius:50%;font-size:8px;line-height:1;color:#555;display:flex;align-items:center;justify-content:center}
.g-title{font-size:14px;font-weight:600;color:var(--h)}
.g-sub{font-size:12px;color:var(--muted3);margin:4px 0 14px}
/* area cards (like farm area cards) */
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters button{font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);color:var(--muted)}
.filters button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.filters .r{margin-left:auto;font-size:12px;color:var(--muted3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.acard{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:14px 16px;position:relative;cursor:pointer;transition:box-shadow .12s}
.acard:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.acard.drag-over{outline:2px dashed var(--green)}
.acard .top1{display:flex;align-items:center;gap:8px}
.acard .handle{cursor:grab;color:#BDBDBD;font-size:13px;letter-spacing:-2px;user-select:none}
.acard .nm{font-size:14px;font-weight:600;color:var(--ink2);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.acard .bdg{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}
.acard .geo{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .meta{font-size:12px;color:var(--muted3);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.acard .meta b{color:var(--ink2);font-weight:600}
.acard .url{font-size:11.5px;color:var(--muted4);margin-top:6px}
.kebab{position:relative}
.kebab>button{width:28px;height:24px;border-radius:6px;color:var(--muted);font-size:15px;letter-spacing:1px}
.kebab>button:hover{background:#F3F3F3}
.menu{position:absolute;right:0;top:26px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:20;min-width:170px;padding:4px}
.menu button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 10px;font-size:12.5px;border-radius:6px;color:var(--ink3)}
.menu button:hover{background:#F5F5F5}
.menu button.rm{color:#E53935}
.addcard{border:1.5px dashed #D9D9D9;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;min-height:150px;cursor:pointer}
.addcard:hover{border-color:var(--green);color:var(--green)}
.addcard b{font-size:22px;font-weight:400}
/* area editor (like Edit farm area) */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.form{background:var(--field);border:1px solid var(--line2);border-radius:6px;padding:16px 12px;display:flex;flex-direction:column;gap:24px}
.form-h{display:flex;align-items:center;gap:16px}
.form-h .t{font-size:14px;font-weight:600;color:var(--ink2);flex:1}
.tglw{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink4)}
.tgl{position:relative;width:44px;height:26px;border-radius:13px;background:#D6D6D6;flex-shrink:0;transition:.15s}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--green)}
.tgl.on:after{left:21px}
.tgl.sm{width:34px;height:20px}
.tgl.sm:after{width:14px;height:14px}
.tgl.sm.on:after{left:17px}
.tgl[disabled]{opacity:.4;cursor:not-allowed}
.segm{display:flex;background:#F3F3F3;border-radius:8px;padding:3px;gap:3px;max-width:420px}
.segm button{flex:1;height:32px;border-radius:6px;font-size:13px;color:var(--muted)}
.segm button.on{background:#fff;color:var(--ink2);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.range-row{display:grid;grid-template-columns:200px 18px 200px;align-items:end;gap:8px}
.range-row .dash{text-align:center;color:var(--muted3);padding-bottom:8px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.presets button{font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 9px;color:var(--muted)}
.presets button.on{background:var(--green-bg);border-color:#CBEACF;color:#1E6B1D}
.rep{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.rep-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.rep-h .acts button{font-size:12px;color:var(--muted);padding:0 4px}
.rep-h .acts button.rm{color:var(--red)}
.rep-h .acts button[disabled]{opacity:.25}
.addlink{color:var(--green);font-size:12px;font-weight:500;text-decoration:underline;display:inline-flex;gap:6px;align-items:center}
.addlink.plus:before{content:"+";border:1.5px solid var(--green);border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.secrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px;background:#fff}
.secrow .nm{flex:1}
.secrow .mv button{width:22px;height:22px;border-radius:4px;color:var(--muted)}
.secrow .mv button[disabled]{opacity:.25}
.img-up{display:flex;align-items:center;gap:10px;border:1px dashed #D8D8D8;border-radius:8px;padding:8px;background:#fff}
.img-up .th{width:72px;height:44px;border-radius:6px;background:#EEE center/cover;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted4);flex-shrink:0}
.img-up .meta{flex:1;font-size:11.5px;color:var(--muted3);line-height:1.35;min-width:0}
.img-up .meta b{display:block;color:var(--ink3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.serp .u{font-size:12px;color:#4D5156}
.serp .t{font-size:17px;color:#1A0DAB;margin:3px 0;font-family:Arial,sans-serif}
.serp .d{font-size:12.5px;color:#4D5156;line-height:1.45;font-family:Arial,sans-serif}
pre.code{background:#1A1D23;color:#D7F5D6;border-radius:8px;padding:10px;font-size:10.5px;line-height:1.45;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-top:8px}
.formfoot{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:14px;align-items:center}
.formfoot .msg{flex:1;font-size:12px;color:var(--muted3)}
/* aside */
.aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.mcard{border:1px solid var(--line);border-radius:8px;padding:22px 16px;text-align:center;position:relative;background:var(--field)}
.mcard b{font-size:24px;font-weight:600;color:var(--muted);display:block}
.mcard span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.mcard small{display:block;font-size:11.5px;color:var(--muted3);margin-top:8px}
.mcard .rf{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:13px;background:#fff}
.small-t{font-size:12px;color:var(--muted2)}
.samples{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.smp{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.smp .ph{height:74px;background:linear-gradient(135deg,#d9d3c7,#9d9483);display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.85)}
.smp .bd{padding:6px 8px 8px}
.smp .pr{color:var(--gold);font-weight:600;font-size:12px}
.smp .ad{font-size:9.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.smp .st{font-size:9px;color:var(--muted3);margin-top:3px}
.ccard{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
.ccard h4{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.checklist div{display:flex;gap:7px;font-size:12px;padding:3px 0;color:var(--ink3);line-height:1.35}
.checklist .ok i{color:#2F8F2E}.checklist .no i{color:var(--red)}.checklist .wn i{color:var(--amber)}
.checklist i{font-style:normal;width:12px;flex-shrink:0}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed #DDD;border-radius:8px}
.disc{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.55;display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;color:#5B3A06}
.disc .di{width:18px;height:18px;border:1.5px solid var(--amber);border-radius:50%;color:var(--amber);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;margin-top:2px}
.disc a{margin-left:auto;color:var(--amber);font-weight:600;text-decoration:underline;cursor:pointer;font-size:12px;white-space:nowrap;padding-top:2px}
.farm-l{font-size:12px;color:var(--muted3);margin-top:6px}
.farm-l b{color:var(--ink3);font-weight:500}
.segm{display:flex;background:#F3F3F3;border-radius:8px;padding:3px;gap:3px;max-width:420px}
.ccard.src p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 0 8px}
.srcname{font-size:14px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srcline{font-size:11.5px;color:var(--muted3);margin-top:2px}
.farms{display:flex;flex-direction:column;gap:6px}
.farmopt{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px}
.farmopt.on{border-color:var(--green);background:var(--green-soft)}
.farmopt.off{background:#FAFAFA;cursor:not-allowed}
.farmopt.off .fn{opacity:.55}
.farmopt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid #CFCFCF;flex-shrink:0;position:relative}
.farmopt.on .rd{border-color:var(--green)}
.farmopt.on .rd:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--green)}
.farmopt .fn{flex:1;min-width:0}
.farmopt .fn b{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
.farmopt .fn small{display:block;font-size:11.5px;color:var(--muted3);margin-top:2px}
/* modal, drawer, toast */
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:#fff;border-radius:12px;width:430px;padding:22px}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--muted);line-height:1.5}
.modal .foot{margin-top:18px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;background:#fff;z-index:61;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer .dh b{font-size:16px}
.drawer .db{padding:18px 22px;overflow:auto;font-size:13px;line-height:1.6;color:var(--ink3)}
.drawer h4{font-size:13.5px;margin:16px 0 6px;color:var(--ink2)}
.drawer ol,.drawer ul{padding-left:18px}
.drawer li{margin-bottom:5px}
.drawer table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px}
.drawer td,.drawer th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.drawer th{background:#FAFAFA}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:600px;text-align:center}

<script>
/* Luxury Homes editor prototype: SEO configuration on top of farm areas. Demo data only, nothing is sent anywhere. */
const SITE='listahomes.com';
// Farm areas as set in IDX Configuration (demo copy of the live one)
const FARMS=[
  {id:'f1',name:'Central Florida Luxury · $1M+',active:true,range:'$1M – Any',types:'All residential',
   county:['Orange','Seminole','Lake','Osceola','Polk','Volusia'],
   city:['Windermere','Golden Oak','Winter Garden','Lake Mary','Bella Collina','Winter Park','Celebration','Reunion','Orlando','Montverde','Oakland','Kissimmee'],
   zip:['32789','32792','34756','34747','32836','32746','34786','34787','32819']},
  {id:'f2',name:'Lake County Estates · $750K+',active:true,range:'$750K – Any',types:'Single Family Residence',
   county:['Lake'],city:['Clermont','Montverde','Mount Dora','Bella Collina'],zip:['34711','34756','32757']},
  {id:'f3',name:'Seminole Golf Homes · $600K+',active:false,range:'$600K – $2M',types:'Single Family Residence, Townhouse',
   county:['Seminole'],city:['Lake Mary','Heathrow','Sanford'],zip:['32746','32771']},
];
// Places that are communities, not cities. In farm areas they are stored in the City field today.
const COMMUNITIES=['Golden Oak','Bella Collina','Reunion'];
const GEO_LABEL={county:'County',city:'City',community:'Community'};
const SECTION_DEFS={hero:{label:'Hero',lock:'first'},about:{label:'About the area'},listings:{label:'Homes for sale (from the farm area)',lock:'required'},guide:{label:'Community guide'},faq:{label:'FAQ'},nearby:{label:'Areas nearby'},cta:{label:'Contact call to action'},disclaimer:{label:'MLS disclaimer and footer',lock:'last'}};
const DEF_SECTIONS=()=>['hero','about','listings','guide','faq','nearby','cta','disclaimer'].map(k=>({k,on:true}));
const FH_WORDS=['family-friendly','family friendly','families','safe neighborhood','safe area','exclusive community','christian','church','young professionals','retirees','empty nesters','kids','children','singles','adult community','perfect for couples','crime-free','no crime','ethnic','hispanic','asian'];
const GRAD=['linear-gradient(135deg,#5b4a32,#1b1610)','linear-gradient(135deg,#334b3e,#0f1712)','linear-gradient(135deg,#3b4658,#10141b)','linear-gradient(135deg,#5a3d3a,#180f0e)','linear-gradient(135deg,#4f5530,#14160c)','linear-gradient(135deg,#2f4a57,#0d161a)'];

function farmById(id){return FARMS.find(f=>f.id===id)||null}
function farmValues(f,type){return !f?[]:type==='county'?f.county:type==='city'?f.city.filter(c=>!COMMUNITIES.includes(c)):f.city.filter(c=>COMMUNITIES.includes(c))}
function farmOptions(a){const f=farmById(a.farmId); const out={}; farmValues(f,a.type).forEach(v=>out[v]=f.name); return out}
function farmOf(a){const f=farmById(a.farmId); return f&&f.active?f:null}
function placeInFarm(a){const f=farmById(a.farmId); return !!(f&&a.place&&farmValues(f,a.type).includes(a.place))}

let uid=100;
function mkArea(o){
  const a=Object.assign({id:++uid,farmId:'',type:'city',place:'',tagline:'',hero:null,card:null,alt:'',
    aboutH2:'',aboutBody:'',guideH2:'',guide:[],faq:[],cta:'',sections:DEF_SECTIONS(),published:false,pinned:false},o);
  setPlace(a,a.type,a.place); return a;
}
const S={
  page:{
    hero:{eyebrow:'Listahomes · Central Florida',h1:'Central Florida Luxury Homes',intro:'Explore luxury homes for sale across Central Florida, from lakefront estates in Windermere to resort homes in Golden Oak.',img:{n:'luxury-homes-hero.jpg',g:5},btn:'Search luxury homes'},
    areas:{h2:'Featured communities',sub:'Pick a community to see its luxury homes for sale and a short local guide.'},
    about:{on:true,h2:'Luxury living in Central Florida',body:'Central Florida luxury homes range from lakefront estates on the Butler Chain of Lakes to golf course homes and resort communities near the theme parks.'},
    faq:{on:true,items:[{q:'Which homes show on these pages?',a:'Active homes for sale that match our luxury search criteria in each area.'},{q:'How often are listings updated?',a:'Listings come from Stellar MLS and refresh several times a day.'}]},
    cta:{on:true,text:'Looking for a luxury home in Central Florida? Talk to our team.',btn:'Contact us'},
  },
  areas:[
    mkArea({farmId:'f1',type:'city',place:'Windermere',published:true,pinned:true,tagline:'Lakefront estates on the Butler Chain of Lakes',hero:{n:'windermere-hero.jpg',g:0},card:{n:'windermere-card.jpg',g:0},alt:'Lakefront estate on the Butler Chain of Lakes in Windermere',aboutH2:'Living in Windermere',aboutBody:'Windermere sits on the Butler Chain of Lakes in southwest Orange County. Homes range from gated lakefront estates with private docks to newer custom builds on wooded lots, about 20 minutes from downtown Orlando.',guideH2:'Windermere community guide',guide:[{h3:'Lakes and boating',body:'The Butler Chain links 11 lakes. Many lakefront homes include boat docks and lifts.'},{h3:'Getting around',body:'SR 429 and the Turnpike connect Windermere to Orlando, Disney and the airport.'}],faq:[{q:'Which county is Windermere in?',a:'Windermere is in Orange County, Florida.'}],cta:'Thinking about a luxury home in Windermere? Talk to our team.'}),
    mkArea({farmId:'f1',type:'community',place:'Golden Oak',published:true,pinned:true,tagline:'Private residences inside Walt Disney World',hero:{n:'golden-oak-hero.jpg',g:1},card:{n:'golden-oak-card.jpg',g:1},alt:'Golden Oak estate home with a resort-style pool',aboutH2:'About Golden Oak',aboutBody:'Golden Oak is a gated residential community inside Walt Disney World Resort, with custom estate homes on large lots and a private clubhouse.',guide:[{h3:'Homes',body:'Mostly custom single-family estates from about 3,000 to more than 10,000 square feet.'}],faq:[{q:'Is Golden Oak a city?',a:'No. Golden Oak is a community inside Walt Disney World Resort in Orange County.'}],cta:'Ask us about current Golden Oak homes.'}),
    mkArea({farmId:'f1',type:'city',place:'Winter Park',published:true,tagline:'Brick streets, chain of lakes and Park Avenue',hero:{n:'winter-park-hero.jpg',g:2},card:{n:'winter-park-card.jpg',g:2},alt:'Historic home on a brick street in Winter Park',aboutH2:'Living in Winter Park',aboutBody:'Winter Park has tree-lined brick streets, the Winter Park Chain of Lakes and a walkable downtown on Park Avenue.',faq:[{q:'Where are luxury homes in Winter Park?',a:'Many are along the Winter Park Chain of Lakes and near Park Avenue.'}],cta:'Looking in Winter Park? We can help.'}),
    mkArea({farmId:'f3',type:'city',place:'Lake Mary',tagline:'Golf course and lakeside homes in Seminole County',aboutBody:'Lake Mary is in Seminole County north of Orlando.'}),
    mkArea({farmId:'f2',type:'county',place:'Lake',tagline:'Hills, lakes and estate lots west of Orlando'}),
    mkArea({farmId:'f2',type:'city',place:'Clermont',tagline:'Rolling hills and lakes in Lake County',aboutBody:'Clermont sits in the rolling hills of south Lake County, with lakes, trails and estate homes on large lots west of Orlando.',hero:{n:'clermont-hero.jpg',g:4},card:{n:'clermont-card.jpg',g:4},alt:'Estate home on a hill above a lake in Clermont'}),
  ],
  view:'home', draft:null, row:null, filter:'all', menuFor:null, pick:null, pickQ:'', dirty:false,
};

/* helpers */
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slugify(s){return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function placeName(type,place){return !place?'':type==='county'?place+' County':place}
function setPlace(a,type,place){a.type=type; a.place=place; a.name=placeName(type,place); a.slug=slugify(a.name)}
function h1Of(a){return (a.name||'{Place}')+' Luxury Homes for Sale'}
function areaUrl(a){return '/luxury-homes/'+(a.slug||'{place}')}
function pub(){return S.areas.filter(a=>a.published)}
function ordered(list){return [...list].sort((x,y)=>(y.pinned-x.pinned)||(S.areas.indexOf(x)-S.areas.indexOf(y)))}
function pinnedCount(ex){return S.areas.filter(a=>a.pinned&&a.id!==ex).length}
function bgOf(img){if(!img)return null; return img.url?`url('${img.url}')`:GRAD[img.g%GRAD.length]}
function fhHits(t){t=' '+String(t||'').toLowerCase()+' '; return FH_WORDS.filter(w=>t.includes(w))}
function dupOf(a){return a.place&&S.areas.find(o=>o.id!==a.id&&o.type===a.type&&o.place===a.place)}
let toastT; function toast(m){clearTimeout(toastT); let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)} t.textContent=m; toastT=setTimeout(()=>t.remove(),3600)}
function getPath(o,p){return p.split('.').reduce((x,k)=>x?.[k],o)}
function setPath(o,p,v){const ks=p.split('.'); const last=ks.pop(); ks.reduce((x,k)=>x[k],o)[last]=v}

/* publish checks */
function checks(a){
  const r=[],add=(ok,t,lvl='err')=>r.push({ok,t,lvl});
  add(!!farmById(a.farmId),'Listings source (farm area) is picked');
  add(!a.farmId||!!farmOf(a),'The farm area is Active');
  add(!!a.place,'A county, city or community is picked');
  add(!a.place||!a.farmId||placeInFarm(a),'The place is in that farm area');
  add(!dupOf(a),'No other area uses the same place');
  add(!!a.hero&&!!a.card,'Hero and card images');
  add(a.alt.trim().length>=10,'Image alt text');
  add(a.aboutBody.trim().length>=60,'About text, 60+ characters');
  add(a.faq.every(q=>q.q.trim()&&q.a.trim())&&a.guide.every(g=>g.h3.trim()&&g.body.trim()),'FAQ and guide items complete');
  const fh=[...new Set([...fhHits(a.aboutBody),...fhHits(a.tagline),...a.guide.flatMap(g=>fhHits(g.body)),...a.faq.flatMap(q=>fhHits(q.a))])];
  if(fh.length) add(false,'Fair Housing wording to review: '+fh.join(', '),'warn');
  return r;
}
const blocking=a=>checks(a).filter(c=>!c.ok&&c.lvl==='err');

/* nav */
const NAV=[['IDX Request',[['IDX Request Status']]],['Global Settings',[['Settings'],['Contact Information'],['Meta Pixel'],['Domain'],['IDX Configuration']]],['Color Settings',[['Color Theme']]],['Core Pages',[['Homepage'],['Search & Listing Results','MLS'],['Property Detail','MLS'],['City Detail','MLS'],['Counties Detail','MLS'],['About'],['Agents'],['Contact Us'],['Market Reports']]],['Lead Generation',[['Home Valuation'],['Relocation']]],['Content & Trust',[['Privacy Policy'],['FAQ'],['Terms & Conditions'],['Testimonials'],["Buyer's Guide"],["Seller's Guide"],['Blog / Market Updates']]],['SEO Content',[['Property Types','SEO'],['City Pages','SEO'],['ZIP Codes','SEO'],['Counties','SEO'],['Luxury Homes','NEW']]]];
$('#enav').innerHTML=NAV.map(([g,it])=>`<div class="g">${g}</div>`+it.map(([n,t])=>`<button class="${n==='Luxury Homes'?'on':''}" data-nav="${esc(n)}"><span class="t">${esc(n)}</span>${t?`<span class="tag ${t==='NEW'?'new':''}">${t==='MLS'?'🔒 MLS':t}</span>`:''}</button>`).join('')).join('');
$('#enav').onclick=e=>{const b=e.target.closest('[data-nav]'); if(!b)return; if(b.dataset.nav==='IDX Configuration') toast('Opens IDX Configuration, where farm areas are managed (not part of this prototype).'); else if(b.dataset.nav!=='Luxury Homes') toast('Only Luxury Homes is clickable in this prototype.')};

/* shared bits */
function row(key,title,summary,badge,body){
  const open=S.row===key;
  return `<div class="rowc ${open?'open':''}"><div class="rowc-h" data-row="${key}"><span class="chev">▶</span><b>${title}</b><span class="sum">${open?'':esc(summary)}</span>${badge}</div>${open?`<div class="rowc-b">${body()}</div>`:''}</div>`;
}
const ED='<span class="badge b-edit">✎ Editable</span>';
function onOff(on){return on?ED:'<span class="badge b-off">Hidden</span>'}
function bindRoot(b){return b.startsWith('p:')?S.page:S.draft}
function bindPath(b){return b.slice(2)}
function inp(bind,ph=''){return `<input class="in" data-bind="${bind}" value="${esc(getPath(bindRoot(bind),bindPath(bind)))}" placeholder="${esc(ph)}">`}
function ta(bind,ph='',h=76){return `<textarea class="ta" style="min-height:${h}px" data-bind="${bind}" placeholder="${esc(ph)}">${esc(getPath(bindRoot(bind),bindPath(bind)))}</textarea>`}
function tglRow(bind,label){const on=getPath(bindRoot(bind),bindPath(bind)); return `<div class="tglw" style="margin-bottom:12px"><button class="tgl sm ${on?'on':''}" data-toggle="${bind}"></button>${label}</div>`}
function rowFoot(){return `<div class="foot"><button class="btn out-red sm" data-row="">Cancel</button><button class="btn dark sm" data-act="saveRow">Save</button></div>`}
function imgField(bind,label,hint){
  const img=getPath(bindRoot(bind),bindPath(bind));
  return `<div class="f"><label>${label}</label><div class="img-up"><div class="th" style="${img?`background:${bgOf(img)} center/cover`:''}">${img?'':'IMG'}</div><div class="meta">${img?`<b>${esc(img.n)}</b>`:'<b style="color:var(--muted3)">No image yet</b>'}${hint}</div>${img?`<button class="btn ghost" style="color:var(--red)" data-rmimg="${bind}">Remove</button>`:''}<button class="btn white sm" data-upimg="${bind}">Upload</button></div></div>`;
}
function repActs(bind,i,n){return `<span class="acts"><button data-mvitem="${bind}:${i}:-1" ${i===0?'disabled':''}>▲</button><button data-mvitem="${bind}:${i}:1" ${i===n-1?'disabled':''}>▼</button><button class="rm" data-rmitem="${bind}:${i}">Remove</button></span>`}
function fhWarn(t){const h=fhHits(t); return h.length?`<div class="warn-box">⚠ Fair Housing check: “${h.join('”, “')}” can read as describing who should live here. Describe the place and the homes instead. You can still save.</div>`:''}
function faqEditor(bind){
  const list=getPath(bindRoot(bind),bindPath(bind));
  return list.map((q,i)=>`<div class="rep"><div class="rep-h"><span>Question ${i+1}</span>${repActs(bind,i,list.length)}</div>
    <input class="in ${!q.q.trim()?'err':''}" data-bind="${bind}.${i}.q" value="${esc(q.q)}" placeholder="Question" style="margin-bottom:6px"><textarea class="ta ${!q.a.trim()?'err':''}" data-bind="${bind}.${i}.a" placeholder="Answer">${esc(q.a)}</textarea>${fhWarn(q.a)}</div>`).join('')+`<button class="addlink plus" data-additem="${bind}:faq">Add question</button>`;
}
function farmBanner(){
  return `<div class="disc"><span class="di">i</span><div><b>SEO configuration only.</b> Luxury Homes is built on your <b>farm areas</b> in IDX Configuration. The listings on these pages come from your farm areas: the same places, price range and property types. Here you only set up the pages: which places get a page, their content and their order. To change which listings show, edit your farm areas.</div><a data-act="goIdx">Go to IDX Configuration</a></div>`;
}

/* ===== HOME ===== */
function renderHome(){
  const P=S.page, all=S.areas, pb=pub();
  const f=S.filter; const list=ordered(all.filter(a=>f==='all'||(f==='published'&&a.published)||(f==='draft'&&!a.published)||(f==='pinned'&&a.pinned)));
  const activeFarms=FARMS.filter(x=>x.active);
  return `
  <div class="c-title"><h2>Luxury Homes</h2></div>
  ${farmBanner()}
  <div class="stats">
    <div class="stat"><small>Area pages</small><b>${all.length}</b></div>
    <div class="stat"><small>Published</small><b>${pb.length} of ${all.length}</b></div>

/* ===== render ===== */
function render(){const c=$('#content'),st=c.scrollTop; c.innerHTML=S.view==='home'?renderHome():renderArea(); c.scrollTop=st}
function rerenderKeep(){
  const ae=document.activeElement; let sel=null,pos=null;
  if(ae&&ae.dataset){ if(ae.dataset.bind)sel=`[data-bind="${CSS.escape(ae.dataset.bind)}"]`; else if(ae.dataset.pickq)sel=`[data-pickq="${ae.dataset.pickq}"]`; pos=ae.selectionStart }
  render(); if(sel){const el=document.querySelector(sel); if(el){el.focus(); try{el.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ===== actions ===== */
function openArea(a){S.view='area';S.draft=JSON.parse(JSON.stringify(a));S.dirty=false;S.row=null;S.pick=null;S.menuFor=null;render();$('#content').scrollTop=0}
function commit(){const a=JSON.parse(JSON.stringify(S.draft)); const i=S.areas.findIndex(x=>x.id===a.id); if(i>=0)S.areas[i]=a; else S.areas.push(a); S.dirty=false}
function dirty(){S.dirty=true}
function confirmBox(title,msg,ok,fn,danger=true){
  $('#layer').innerHTML=`<div class="ovl"><div class="modal"><h3>${title}</h3><p>${msg}</p><div class="foot"><button class="btn ghost" data-x="c">Cancel</button><button class="btn ${danger?'red':'green'} sm" data-x="ok">${ok}</button></div></div></div>`;
  $('#layer').onclick=e=>{const x=e.target.dataset.x; if(x==='c'||e.target.classList.contains('ovl'))$('#layer').innerHTML=''; if(x==='ok'){$('#layer').innerHTML='';fn()}};
}
function upload(bind,demo){
  const root=bindRoot(bind),path=bindPath(bind);
  if(demo){setPath(root,path,{n:(S.draft?.slug||'luxury-homes')+'-'+path.split('.').pop()+'.jpg',g:Math.floor(Math.random()*6)}); if(S.draft)dirty(); render(); return}
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/jpeg,image/webp,image/png';
  inp.onchange=()=>{const f=inp.files[0]; if(!f)return; setPath(root,path,{n:f.name,url:URL.createObjectURL(f)}); if(S.draft)dirty(); render()};
  inp.click();
}
function togglePin(a){if(!a.pinned&&pinnedCount(a.id)>=6){toast('You can pin up to 6 areas. Unpin one first.');return false} a.pinned=!a.pinned; return true}
function publishArea(a){const b=blocking(a); if(b.length){toast(`${a.name||'This area'} can't be published yet: ${b[0].t.toLowerCase()}.`);return false} a.published=true; return true}

document.addEventListener('click',e=>{
  if(S.pick&&!e.target.closest('.pickw')){S.pick=null;S.pickQ='';render()}
  if(S.menuFor&&!e.target.closest('.kebab')){S.menuFor=null;render()}
},true);

$('#content').addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-row],[data-act],[data-open],[data-pickopen]'); if(!t)return; const d=t.dataset;
  if(d.pickopen){ if(S.pick!==d.pickopen){S.pick=d.pickopen;S.pickQ='';render(); const i=document.querySelector(`[data-pickq="${d.pickopen}"]`); i&&i.focus()} return }
  if(d.row!==undefined&&!t.matches('.btn')||(d.row===''&&t.matches('.btn'))){ S.row=(S.row===d.row||d.row==='')?null:d.row; render(); return }
  if(d.filter){S.filter=d.filter;render();return}
  if(d.menu){e.stopPropagation();S.menuFor=S.menuFor==+d.menu?null:+d.menu;render();return}
  const find=id=>S.areas.find(a=>a.id==id);
  if(d.edit){openArea(find(d.edit));return}
  if(d.pin){const a=find(d.pin); S.menuFor=null; if(togglePin(a))toast(a.pinned?`${a.name} pinned${a.published?'. It now shows first and in the site menu.':'. It shows in the menu once published.'}`:`${a.name} unpinned.`); render(); return}
  if(d.pubtog){const a=find(d.pubtog); S.menuFor=null;
    if(a.published) confirmBox('Set '+esc(a.name)+' as draft?','The page returns 404 and leaves /luxury-homes, the site menu and the sitemap. The content is kept.','Set as Draft',()=>{a.published=false;toast(a.name+' is now a draft.');render()});
    else if(publishArea(a)){toast(a.name+' is live at '+SITE+areaUrl(a)+'.'); render()} else {openArea(a)} return}
  if(d.dup){const s=find(d.dup); S.menuFor=null; const c=mkArea(Object.assign(JSON.parse(JSON.stringify(s)),{id:++uid,place:'',published:false,pinned:false})); openArea(c); toast('Content copied. Pick the place for the new area.'); return}
  if(d.del){const a=find(d.del); S.menuFor=null; confirmBox('Delete '+esc(a.name)+'?',a.published?'This page is live. It will be removed from the site and the sitemap and its URL will redirect to /luxury-homes. This cannot be undone.':'This draft and its content will be deleted. This cannot be undone.','Delete',()=>{S.areas=S.areas.filter(x=>x!==a);toast(a.name+' deleted.');render()}); return}
  if(d.open&&!e.target.closest('.kebab,.handle')){openArea(find(d.open));return}
  if(d.picktype){const a=S.draft; if(a.type!==d.picktype)setPlace(a,d.picktype,''); S.pick=null; dirty(); render(); return}
  if(d.pickval){const [k,v]=d.pickval.split('|'); setPlace(S.draft,k,v); S.pick=null; S.pickQ=''; dirty(); render(); return}
  if(d.farm){const a=S.draft; if(a.farmId!==d.farm){a.farmId=d.farm; if(a.place&&!placeInFarm(a))setPlace(a,a.type,''); S.pick=null; dirty(); render()} return}
  if(d.toggle){const r=bindRoot(d.toggle),p=bindPath(d.toggle); setPath(r,p,!getPath(r,p)); if(r===S.draft)dirty(); render(); return}
  if(d.upimg){upload(d.upimg,e.shiftKey);return}
  if(d.rmimg){setPath(bindRoot(d.rmimg),bindPath(d.rmimg),null); if(S.draft)dirty(); render(); return}
  if(d.additem){const b=d.additem.slice(0,d.additem.lastIndexOf(':')),kind=d.additem.split(':').pop(); getPath(bindRoot(b),bindPath(b)).push(kind==='faq'?{q:'',a:''}:{h3:'',body:''}); if(b.startsWith('d:'))dirty(); render(); return}
  if(d.mvitem){const p=d.mvitem.split(':'); const b=p[0]+':'+p[1],i=+p[2],j=i+ +p[3]; const L=getPath(bindRoot(b),bindPath(b)); [L[i],L[j]]=[L[j],L[i]]; if(p[0]==='d')dirty(); render(); return}
  if(d.rmitem){const p=d.rmitem.split(':'); const b=p[0]+':'+p[1]; getPath(bindRoot(b),bindPath(b)).splice(+p[2],1); if(p[0]==='d')dirty(); render(); return}
  if(d.smove){const [i,dir]=d.smove.split(':').map(Number),s=S.draft.sections; [s[i],s[i+dir]]=[s[i+dir],s[i]]; dirty(); render(); return}
  if(d.stog){const s=S.draft.sections[+d.stog]; s.on=!s.on; dirty(); render(); return}
  const a=S.draft;
  switch(d.act){
    case 'help': openHelp(); break;
    case 'goIdx': toast('Opens IDX Configuration › Farm areas (not part of this prototype).'); break;
    case 'add': openArea(mkArea({type:''})); break;
    case 'saveRow': S.row=null; toast(S.view==='area'?'Section updated. Press Save to keep the area changes.':'Saved. Goes live with the next Publish.'); render(); break;
    case 'back': if(S.dirty) confirmBox('Discard changes?','You have unsaved changes on this area.','Discard',()=>{S.view='home';S.draft=null;S.dirty=false;render()}); else {S.view='home';S.draft=null;render()} break;
    case 'save':
      if(!farmOf(a)){toast('Pick an Active farm area as the listings source.');break}
      if(!a.place){toast('Pick a county, city or community.');break}
      if(dupOf(a)){toast(a.name+' already has a page.');break}
      if(a.published&&blocking(a).length){toast('A published page must stay complete: '+blocking(a)[0].t.toLowerCase()+'. Fix it or switch Published off.');break}
      commit(); toast(a.published?`Saved. ${a.name} is live at ${SITE}${areaUrl(a)}.`:`${a.name} saved as a draft.`); S.view='home'; S.draft=null; render(); break;
    case 'pubDraft': if(a.published){a.published=false; dirty(); render()} else if(publishArea(a)){dirty(); render(); toast('Published is on. Press Save to make the page live.')} break;
    case 'pinDraft': if(togglePin(a)){dirty(); render()} break;
  }
});
$('#content').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pickq){S.pickQ=t.value; if(S.pick!==t.dataset.pickq)S.pick=t.dataset.pickq; rerenderKeep(); return}
  if(t.dataset.bind){const b=t.dataset.bind,r=bindRoot(b); setPath(r,bindPath(b),t.value); if(r===S.draft)dirty(); rerenderKeep(); return}
});
$('#content').addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.pick){S.pick=null;render()} });
// drag to reorder area cards
let dragId=null;
$('#content').addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]'); if(c){dragId=+c.dataset.drag; e.dataTransfer.effectAllowed='move'}});
$('#content').addEventListener('dragover',e=>{const c=e.target.closest('[data-drag]'); if(!c||dragId==null)return; e.preventDefault(); document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over')); c.classList.add('drag-over')});
$('#content').addEventListener('drop',e=>{const c=e.target.closest('[data-drag]'); if(!c||dragId==null)return; e.preventDefault(); const from=S.areas.find(a=>a.id===dragId),to=S.areas.find(a=>a.id==c.dataset.drag); dragId=null; if(!from||from===to){render();return} if(from.pinned!==to.pinned){toast('Pinned areas always come first. Pin or unpin to move between the groups.');render();return} S.areas.splice(S.areas.indexOf(from),1); S.areas.splice(S.areas.indexOf(to),0,from); render(); toast('Order saved. /luxury-homes shows the cards in this order.')});
$('#content').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))});

/* header */
$('#btnPreview').onclick=()=>toast('Opens the Microsite preview (not part of this prototype).');
$('#btnPub').onclick=()=>{const p=pub().length,d=S.areas.length-p; confirmBox('Publish the Microsite?',`All saved changes go live. Luxury Homes: /luxury-homes and ${p} area page${p===1?'':'s'}${d?`; ${d} draft${d>1?'s stay':' stays'} hidden`:''}.`,'Publish',()=>{$('#lastPub').textContent='Last published November 5, 2026 at '+new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); toast('Microsite published.')},false)};
$('#btnUnpub').onclick=()=>toast('Prototype: Unpublish takes the whole Microsite offline. Not simulated.');
document.querySelector('.back').onclick=()=>toast('Back to Microsites (not part of this prototype).');

render();
</script>
